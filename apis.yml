name: Aviva
description: >-
  Aviva (Aviva Financial, S.A. de C.V., SOFOM E.N.R.) is a Mexican fintech
  lender operating under the tagline "Tu historia importa." It offers quick,
  secured personal and business loans originated in person through a network of
  100+ physical kiosks across central Mexico (Puebla, Hidalgo, Estado de Mexico,
  Morelos, Queretaro, Tlaxcala and Veracruz), using a video-call onboarding flow
  (the Aviva Onboarding System, AOS) with same-day or 24-hour direct-deposit
  disbursement. Products include Aviva Contigo (everyday expenses, up to
  $15,000), Aviva tu Negocio (business owners, up to $20,000), Aviva tu Compra
  (appliances at Bodega Aurrera), and Aviva tu Casa (construction materials via
  Construrama). Borrowers manage payments through the Aviva mobile app. Aviva was
  surfaced as a 500 Global portfolio company and added to the API Evangelist
  network. As of this enrichment pass Aviva publishes no public developer
  portal, API, SDKs, or OpenAPI - it exposes a consumer web/app and kiosk
  surface only.
